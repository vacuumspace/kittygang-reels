name: Theme Housie reel

on:
  schedule:
    - cron: '0 19 * * *'    # 12:30 AM IST: today's theme reel, posted on Instagram + YouTube Shorts
    # GitHub delays night runs 2-3 hours, so the messaging Worker also starts this at 12:20 AM IST (workflow_dispatch).
    # All of these are backups and do nothing once the day's reel is posted
    - cron: '40 19 * * *'   # 1:10 AM IST
    - cron: '30 20 * * *'   # 2:00 AM IST
    - cron: '30 22 * * *'   # 4:00 AM IST
  workflow_dispatch:
    inputs:
      date: { description: 'IST date YYYY-MM-DD (blank = today)', required: false }
      dry: { description: 'Render only, do not post', type: boolean, default: false }

concurrency: { group: render, cancel-in-progress: false }

jobs:
  theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # static ffmpeg from GitHub (Ubuntu apt mirrors hang or fail at times)
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          curl -sSfL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo /tmp/ff/bin >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -version | head -1
      - run: pipx install edge-tts
      - run: npm ci
      - name: Render today's theme reel and post it
        env:
          EDGE_TTS_BIN: edge-tts
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_ID: ${{ secrets.YT_THEME_PLAYLIST_ID }}
        run: node scripts/theme/daily.js ${{ github.event.inputs.date }} ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
      - name: Save tracker
        if: always()
        run: |
          git config user.name "kittygang-bot"
          git config user.email "bot@kittyparty.club"
          git add autopilot/tracker.json
          git diff --cached --quiet || (git commit -m "tracker: theme reel" && git pull --rebase && git push)
