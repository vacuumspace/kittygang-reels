name: Leaderboard story

# Daily 6 PM IST: today's top 10 on the day's theme art + theme music, posted as an Instagram Story and a Facebook
# Page story. Started by the messaging Worker at 5:35 PM IST (backup 5:50, GitHub's own schedule runs late); the script
# renders, waits for 6:00 PM, posts, and does nothing on a second run the same day.
on:
  schedule:
    - cron: '20 12 * * *'   # 5:50 PM IST, one more backup
  workflow_dispatch:
    inputs:
      date: { description: 'IST date YYYY-MM-DD (blank = today)', required: false }
      dry: { description: 'Render only, do not post', type: boolean, default: false }

# its own group, so it never waits behind a reel render
concurrency: { group: leaderboard, cancel-in-progress: false }

jobs:
  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          curl -sSfL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo /tmp/ff/bin >> "$GITHUB_PATH"
      - run: npm ci
      - name: Render today's leaderboard story and post it at 6 PM
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/leaderboard/story.js ${{ github.event.inputs.date }} ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
