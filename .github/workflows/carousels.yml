name: Render carousels

on:
  push:
    branches: [main]
    paths: ['carousels/drafts/**']
  workflow_dispatch:

# same group as the reel render so the two never write the tracker at the same time
concurrency: { group: render, cancel-in-progress: false }

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # static ffmpeg from GitHub (Ubuntu apt mirrors hang or fail at times)
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          curl -sSfL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo /tmp/ff/bin >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -version | head -1
      - run: npm ci
      - name: Render new game carousels, publish web pages, book posting slots
        env:
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/carousels/render-new.js
      - name: Save tracker
        run: |
          git config user.name "kittygang-bot"
          git config user.email "bot@kittyparty.club"
          git add autopilot/tracker.json
          git diff --cached --quiet || (git commit -m "tracker: game carousel rendered and queued" && git pull --rebase && git push)
