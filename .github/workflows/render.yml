name: Render reels

on:
  push:
    branches: [main]
    paths: ['autopilot/drafts/**']
  workflow_dispatch:

concurrency: { group: render, cancel-in-progress: false }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
      - run: pipx install edge-tts
      - run: npm ci
      - name: Render new drafts, upload, book posting slots
        env:
          EDGE_TTS_BIN: edge-tts
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_ID: ${{ secrets.YT_PLAYLIST_ID }}
        run: node scripts/autopilot/render-new.js
      - name: Save tracker
        run: |
          git config user.name "kittygang-bot"
          git config user.email "bot@kittyparty.club"
          git add autopilot/tracker.json
          git diff --cached --quiet || (git commit -m "tracker: rendered and queued" && git pull --rebase && git push)
